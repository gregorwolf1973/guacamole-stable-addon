# Vorschalt-Server fuer Guacamole (Tomcat lauscht nur auf 127.0.0.1:8081)
daemon off;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes 1;

events {
    worker_connections 512;
}

http {
    access_log off;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    client_max_body_size 0;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Gemeinsame Proxy-Einstellungen (Pfade unveraendert weiterreichen,
    # damit das Ingress-Praefix wie bisher ueber relative URLs funktioniert)
    upstream guacamole_tomcat {
        server 127.0.0.1:8081;
        keepalive 16;
    }

    # Direkter Zugang (Port 8080): Anmeldung wie bisher, Header immer leeren,
    # damit von aussen niemand die Anmeldung per Header vortaeuschen kann.
    server {
        listen 8080;
        server_name _;

        location / {
            proxy_pass http://guacamole_tomcat;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Guac-Ingress-User "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    # Ingress (Port 8099): nur der HA-Supervisor (172.30.32.2) darf zugreifen.
    server {
        listen 8099;
        server_name _;

        allow 172.30.32.2;
        allow 127.0.0.1;
        deny all;

        location / {
            proxy_pass http://guacamole_tomcat;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Von run.sh erzeugt: setzt den Header auf guacadmin oder leert ihn
            include /etc/guacamole-nginx/ingress-auth.conf;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
